server:
  port: 8080
  servlet:
    session:
      cookie:
        name: JSESSIONID
        same-site: none
        secure: true
        http-only: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hobby_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  web:
    cors:
      allowed-origins:
        - http://localhost
        - http://localhost:4200
        - http://82.115.18.109
        - https://eventmevent.com
        - https://www.eventmevent.com
        - https://api.eventmevent.com
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            authorization-grant-type: authorization_code
            client-name: Google
        provider:
          google:
            issuer-uri: https://accounts.google.com

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
logging:
  level:
    com.hobby: DEBUG

app:
  name: Hobby Manager
  sms:
    enabled: false
    provider: twilio
  google:
    credentials:
      file:
        path: ${GOOGLE_CREDENTIALS_FILE_PATH:}
    application:
      name: Hobby Manager
  frontend:
    base-url: https://eventmevent.com
    callback-path: /auth/callback
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurityPurposes}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

