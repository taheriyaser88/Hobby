<div class="task-form-page">
    <form (ngSubmit)="onSubmit()">
        <header class="form-header">
            <h1>{{ isEditMode ? 'ویرایش وظیفه' : 'ایجاد وظیفه جدید' }}</h1>
            <p>{{ isEditMode ? 'اطلاعات وظیفه را ویرایش کنید' : 'اطلاعات وظیفه خود را وارد کنید' }}</p>
        </header>
        <div class="form-grid">
            <div class="form-group">
                <label>عنوان وظیفه *</label>
                <input type="text" [(ngModel)]="task.title" name="title" required placeholder="مثال: طراحی پوستر">
            </div>

            <div class="form-group">
                <label>مسئول</label>
                <select [(ngModel)]="task.assigneeId" name="assigneeId">
                    <option [value]="null">انتخاب کنید</option>
                    <option *ngFor="let user of users" [value]="user.id">{{ user.fullName }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>رویداد مربوطه</label>
                <select [(ngModel)]="task.eventId" name="eventId">
                    <option [value]="null">انتخاب کنید</option>
                    <option *ngFor="let event of events" [value]="event.id">{{ event.title }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>وضعیت</label>
                <select [(ngModel)]="task.status" name="status">
                    <option value="todo">در انتظار</option>
                    <option value="inprogress">در حال انجام</option>
                    <option value="done">انجام شده</option>
                </select>
            </div>

            <div class="form-group">
                <label>اولویت</label>
                <select [(ngModel)]="task.priority" name="priority">
                    <option value="low">پایین</option>
                    <option value="medium">متوسط</option>
                    <option value="high">بالا</option>
                </select>
            </div>

            <div class="form-group">
                <label>زمان سررسید <small style="color: #777; font-weight: normal;">(اختیاری)</small></label>
                <div class="time-input-group">
                    <input 
                        type="number" 
                        [(ngModel)]="dueTimePersian.hour" 
                        name="dueTimeHour"
                        placeholder="ساعت" 
                        min="0"
                        max="23"
                        style="width: 80px; direction: rtl; text-align: center;">
                    <span>:</span>
                    <input 
                        type="number" 
                        [(ngModel)]="dueTimePersian.minute" 
                        name="dueTimeMinute"
                        placeholder="دقیقه" 
                        min="0"
                        max="59"
                        style="width: 80px; direction: rtl; text-align: center;">
                </div>
            </div>

            <div class="form-group full-width">
                <label>توضیحات</label>
                <textarea [(ngModel)]="task.description" name="description" rows="4" placeholder="توضیحات کامل وظیفه..."></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-cancel" (click)="cancel()">انصراف</button>
            <button type="submit" class="btn-submit">{{ isEditMode ? 'ذخیره تغییرات' : 'ایجاد وظیفه' }}</button>
        </div>
    </form>
</div>
