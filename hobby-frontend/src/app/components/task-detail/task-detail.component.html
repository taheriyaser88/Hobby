<div class="task-detail-container">
    <div class="task-detail-wrapper">
        <header class="detail-header">
            <button class="btn-back" (click)="onBack()">← بازگشت</button>
            <div class="header-actions">
                <button class="btn-edit" (click)="onEdit()">ویرایش</button>
                <button class="btn-delete" (click)="onDelete()">حذف</button>
            </div>
        </header>

        <div class="task-detail" *ngIf="task">
        <div class="task-status-badge" [class]="'status-' + task.status">
            {{ getStatusText(task.status) }}
        </div>
        
        <h1>{{ task.title }}</h1>
        
        <div class="task-meta">
            <div class="meta-item">
                <strong>مسئول:</strong> {{ task.assignee }}
            </div>
            <div class="meta-item">
                <strong>اولویت:</strong> 
                <span class="priority-badge" [class]="'priority-' + task.priority">
                    {{ getPriorityText(task.priority) }}
                </span>
            </div>
        </div>

        <div class="task-description" *ngIf="task.description">
            <h3>توضیحات</h3>
            <p>{{ task.description }}</p>
        </div>
    </div>
    </div>
</div>
