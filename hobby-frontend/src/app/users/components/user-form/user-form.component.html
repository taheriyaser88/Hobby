<div class="user-form-container">
    <form (ngSubmit)="onSubmit()">
        <header class="form-header">
            <h1>{{ isEditMode ? 'ویرایش کاربر' : 'افزودن کاربر جدید' }}</h1>
            <p>{{ isEditMode ? 'اطلاعات کاربر را ویرایش کنید' : 'اطلاعات کاربر جدید را وارد کنید' }}</p>
        </header>
        <div class="form-grid">
            <div class="form-group">
                <label>نام کامل *</label>
                <input 
                    type="text" 
                    [(ngModel)]="user.fullName" 
                    name="fullName"
                    placeholder="نام کامل کاربر را وارد کنید"
                    required>
            </div>

            <div class="form-group">
                <label>ایمیل *</label>
                <input 
                    type="email" 
                    [(ngModel)]="user.email" 
                    name="email"
                    placeholder="ایمیل کاربر را وارد کنید"
                    required>
            </div>

            <div class="form-group">
                <label>شماره تلفن</label>
                <input 
                    type="tel" 
                    [(ngModel)]="user.phone" 
                    name="phone"
                    placeholder="شماره تلفن (اختیاری)">
            </div>

            <div class="form-group">
                <label>نقش *</label>
                <select [(ngModel)]="user.role" name="role" required>
                    <option [value]="UserRole.ADMIN">{{ getRoleText(UserRole.ADMIN) }}</option>
                    <option [value]="UserRole.ORGANIZER">{{ getRoleText(UserRole.ORGANIZER) }}</option>
                    <option [value]="UserRole.STAFF">{{ getRoleText(UserRole.STAFF) }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>وضعیت *</label>
                <select [(ngModel)]="user.status" name="status" required>
                    <option [value]="UserStatus.ACTIVE">{{ getStatusText(UserStatus.ACTIVE) }}</option>
                    <option [value]="UserStatus.INACTIVE">{{ getStatusText(UserStatus.INACTIVE) }}</option>
                    <option [value]="UserStatus.SUSPENDED">{{ getStatusText(UserStatus.SUSPENDED) }}</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="btn-cancel" (click)="cancel()">انصراف</button>
            <button type="submit" class="btn-submit">{{ isEditMode ? 'ذخیره تغییرات' : 'ایجاد کاربر' }}</button>
        </div>
    </form>
</div>
