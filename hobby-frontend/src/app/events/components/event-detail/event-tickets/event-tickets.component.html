<div class="card">
    <h4>بلیت‌ها</h4>
    <table style="margin-top:12px" *ngIf="tickets.length > 0; else noTickets">
        <thead><tr><th>نوع بلیت</th><th>قیمت</th><th>ظرفیت</th><th>فروخته شده</th><th>عملیات</th></tr></thead>
        <tbody>
        <tr *ngFor="let ticket of tickets">
            <td>{{ ticket.name || '—' }}</td>
            <td>{{ getPersianNumber(ticket.price) }} {{ ticket.currency === 'IRR' ? 'تومان' : (ticket.currency || '') }}</td>
            <td>{{ getPersianNumber(ticket.quantity) }}</td>
            <td>{{ getPersianNumber(ticket.soldCount || 0) }}</td>
            <td>
                <button class="btn secondary" (click)="editTicket(ticket.name || '')">ویرایش</button>
                <button class="btn" (click)="viewSales(ticket.name || '')">آمار</button>
            </td>
        </tr>
        </tbody>
    </table>
    <ng-template #noTickets>
        <p class="small" style="margin-top:12px;text-align:center;color:#777">هنوز بلیتی تعریف نشده است.</p>
    </ng-template>
</div>
