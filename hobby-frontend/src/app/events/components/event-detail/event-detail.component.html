<div class="container">
    <main class="content">
        <div class="page-title">
            <div>
                <div class="event-title">{{ event?.title || '—' }}</div>
                <div class="meta">
                    <span *ngIf="getEventDate()">{{ getEventDate() }}</span>
                    <span *ngIf="getEventLocation()"> • {{ getEventLocation() }}</span>
                    <span class="small" *ngIf="getEventCode()"> • کد رویداد: {{ getEventCode() }}</span>
                </div>
            </div>
            <div>
                <button class="btn secondary" (click)="togglePublish()">
                    {{ event?.status === 'PUBLISHED' ? 'عدم انتشار' : 'انتشار' }}
                </button>
                <button class="btn secondary" (click)="backToEvents()">← بازگشت به لیست رویدادها</button>
            </div>
        </div>

        <div class="tabs">
            <a class="tab" [class.active]="isTabActive('overview')" [routerLink]="['overview']">نمای کلی</a>
            <a class="tab" [class.active]="isTabActive('tasks')" [routerLink]="['tasks']">وظایف</a>
            <a class="tab" [class.active]="isTabActive('sessions')" [routerLink]="['sessions']">جلسات</a>
            <a class="tab" [class.active]="isTabActive('tickets')" [routerLink]="['tickets']">بلیت‌ها</a>
            <a class="tab" [class.active]="isTabActive('attendees')" [routerLink]="['attendees']">شرکت‌کنندگان</a>
            <a class="tab" [class.active]="isTabActive('analytics')" [routerLink]="['analytics']">آنالیز</a>
            <a class="tab" [class.active]="isTabActive('integrations')" [routerLink]="['integrations']">اتصالات</a>
            <a class="tab" [class.active]="isTabActive('settings')" [routerLink]="['settings']">تنظیمات</a>
        </div>

        <router-outlet></router-outlet>

        <footer>© ۲۰۲۵ سامانه مدیریت رویداد — تمام حقوق محفوظ است</footer>
    </main>
</div>
